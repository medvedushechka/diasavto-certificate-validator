name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://diasavto-validator-api.vercel.app
          VITE_SUPABASE_URL: https://scnmiwnagnqqhxzlvjan.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fb-dtNPaI-HNh46KojQKOw_S9K0Y3Nk
        run: npm run build -- --mode pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
